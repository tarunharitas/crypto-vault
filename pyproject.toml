[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crypto-vault-cli"
version = "2.0.0"
description = "Secure local password vault and authenticated file encryption CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tarun Sharma"}]
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=42,<47",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "pyperclip>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
cryptovault = "crypto_vault.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["crypto_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
omit = ["crypto_vault/gui/app.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"crypto_vault/cli/main.py" = ["B008"]
"crypto_vault/gui/app.py" = ["BLE001"]
